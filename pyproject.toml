[project]
name = "license-pipeline"
version = "0.1.0"
description = "Synthetic software-license data quality pipeline with early renewal and compliance alerts"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "rapidfuzz>=3.9",
    "google-cloud-bigquery>=3.25",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=license_pipeline --cov-report=term-missing"
