name: Update evidence

# Rewrites the "Recent runs" table in docs/EVIDENCE.md after each digest run and keeps only
# the last 7 days. The commit also counts as repository activity, which stops GitHub from
# switching off scheduled workflows after 60 days without one.
on:
  workflow_run:
    workflows: ["Daily digest"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: update-evidence
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rewrite the runs table
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PYTHONPATH: src
        run: python -m license_pipeline.evidence docs/EVIDENCE.md
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EVIDENCE.md
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "chore: update evidence (last 7 days)"
            git push
          fi
